spring.application.name=ordersystem

# PostgreSQL datasource settings
spring.datasource.url=jdbc:postgresql://localhost:5432/inventorydb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/inventorydb
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Stripe API Keys (Use your test keys for development)
stripe.secret.key=sk_test_
stripe.publishable.key=pk_test_

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

payment.service.url=localhost:8082
rabbitmq.exchange.name=payment.exchange
rabbitmq.queue.succeeded=payment.succeeded.queue
rabbitmq.queue.failed=payment.failed.queue
rabbitmq.routingkey.succeeded=payment.succeeded.routingkey
rabbitmq.routingkey.failed=payment.failed.routingkey