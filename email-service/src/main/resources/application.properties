
# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.name=payment.exchange
rabbitmq.queue.succeeded=payment.succeeded.queue
rabbitmq.queue.failed=payment.failed.queue
rabbitmq.routingkey.succeeded=payment.succeeded.routingkey
rabbitmq.routingkey.failed=payment.failed.routingkey
rabbitmq.queue.email=email.queue
rabbitmq.routingkey.email=email.send.routingkey
rabbitmq.email.exchange=email.exchange