# Use an in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests, as it's not needed for an in-memory DB
spring.flyway.enabled=false

# You can also set dummy values for other properties needed by tests
payment.service.url=http://localhost:9999
spring.rabbitmq.host=localhost

rabbitmq.exchange.name=payment.exchange
rabbitmq.queue.succeeded=payment.succeeded.queue
rabbitmq.queue.failed=payment.failed.queue
rabbitmq.routingkey.succeeded=payment.succeeded.routingkey
rabbitmq.routingkey.failed=payment.failed.routingkey
rabbitmq.queue.email=email.queue
rabbitmq.routingkey.email=email.send.routingkey
rabbitmq.email.exchange=email.exchange